name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repomind
          POSTGRES_PASSWORD: repomind
          POSTGRES_DB: repomind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://repomind:repomind@localhost:5432/repomind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      # Regression gate: fails if any metric drops below evals/thresholds.json.
      # Uses the deterministic hashing embedder, so no model download in CI.
      - run: python -m evals.run --embedder hashing --out eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
