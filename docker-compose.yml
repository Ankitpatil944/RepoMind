services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      # localhost only; 5433 avoids clashing with a Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://repomind:repomind@db:5432/repomind
      # Folders the API may index (':'-separated, as seen inside the container).
      REPOS_ROOT: /repos:/samples:/clones
      # Repositories cloned from a Git URL land here (writable volume).
      CLONES_DIR: /clones
      FASTEMBED_CACHE_PATH: /models
      EMBEDDER: ${EMBEDDER:-fastembed}
      RERANKER: ${RERANKER:-fastembed}
      # Any OpenAI-compatible chat endpoint. Defaults to Ollama on the host.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your code goes here (set REPOS_DIR in .env to use another folder).
      - ${REPOS_DIR:-./repos}:/repos:ro
      # Bundled sample project for a zero-setup demo.
      - ./evals/repos:/samples:ro
      - models:/models
      - clones:/clones
    ports:
      # localhost only: the API has no authentication.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  clones:
